name: snapvault
version: '3.8'

services:
  # PostgreSQL Database container
  db:
    image: postgres:15-alpine
    container_name: snapvault-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: snapvault
      POSTGRES_PASSWORD: snapsecurepass
      POSTGRES_DB: snapdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # Node.js/Express Backend container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: snapvault-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_CLIENT_EXTERNAL_URL: ${S3_CLIENT_EXTERNAL_URL}
    depends_on:
      - db
    restart: always

  # React Frontend served via Nginx container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: snapvault-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

  # Jenkins CI/CD Automation container
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: snapvault-jenkins
    ports:
      - "8080:8080"     # Web Console UI
      - "50000:50000"   # Agent connection port
    environment:
      - JAVA_OPTS=-Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace
    user: root          # Required to allow Jenkins to access host's docker.sock
    restart: always

  # Prometheus monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: snapvault-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - backend
    restart: always

  # Grafana dashboard visualization
  grafana:
    image: grafana/grafana:latest
    container_name: snapvault-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: always

volumes:
  postgres_data:
  jenkins_data:
  prometheus_data:
  grafana_data:
